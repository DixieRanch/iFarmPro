version: '3.8'

services:
  dev-environment:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces:cached
    working_dir: /workspaces/iFarmPro
    entrypoint: ["/bin/bash", "-c", "mkdir -p /tmp/runtime-$USER && exec /bin/bash"]
    tty: true
    stdin_open: true
    environment:
      USERNAME: postgres
      PASSWORD: postgres
      IP: postgres
      XDG_RUNTIME_DIR: /tmp/runtime-${USER}

  postgres:
    image: postgres:14
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ifarmpro_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: