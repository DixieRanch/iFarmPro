inherit_from: .rubocop_todo.yml

AllCops:
  Include:
    - '**/Rakefile'
    - '**/config.ru'
    - '**/Gemfile'
    - '**/Guardfile'
  Exclude:
    - 'db/**/*'
    - 'config/**/*'
    - 'script/**/*'
  TargetRailsVersion: 4.2
  DisplayCopNames: true
    
Rails:
  Enabled: true
  
Rails/FindBy:
  Include:
    - 'app/**/*'
  Exclude:
    - 'app/models/user.rb'
  
Style/Documentation:
  Enabled: false
  
Style/SymbolArray:
  EnforcedStyle: brackets
  
Style/EmptyMethod:
  EnforcedStyle: expanded
  
Style/NumericLiterals:
  MinDigits: 15
  
Metrics/BlockLength:
  ExcludedMethods: 
    - configure
    - context
    - define
    - describe
    - group
    - guard
    - namespace
    