name: CI & Deploy to Heroku (tests must pass)

on:
  push:
    branches:
      - master

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:12
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ifarmpro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ifarmpro_test
      RAILS_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '2.4.2'
          cache: 'bundler'

      - name: Install dependencies (including test gems)
        run: |
          gem install bundler --conservative
          bundle install --jobs 4 --retry 3

      - name: Wait for Postgres
        run: |
          for i in {1..15}; do
            pg_isready -h 127.0.0.1 -p 5432 && break
            sleep 1
          done

      - name: Create, migrate and seed test database
        run: |
          bundle exec rake db:create
          bundle exec rake db:migrate
          bundle exec rake db:seed

      - name: Run tests
        run: |
          bundle exec rspec --format documentation

  deploy:
    name: Deploy to Heroku
    runs-on: ubuntu-latest
    needs: test
    if: ${{ needs.test.result == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '2.4.2'
          cache: 'bundler'

      - name: Install production dependencies
        env:
          BUNDLE_JOBS: 4
        run: |
          gem install bundler --conservative
          bundle config set without 'development test'
          bundle install --jobs 4 --retry 3

      - name: Precompile assets
        env:
          RAILS_ENV: production
          RAILS_SERVE_STATIC_FILES: 'true'
        run: |
          bundle exec rake assets:precompile

      - name: Deploy to Heroku
        uses: akhileshns/heroku-deploy@v3.12.12
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: ${{ secrets.HEROKU_APP_NAME }}
          heroku_email: ${{ secrets.HEROKU_EMAIL }}

      - name: Run database migrations on Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          curl https://cli-assets.heroku.com/install.sh | sh
          heroku run rake db:migrate --app ${{ secrets.HEROKU_APP_NAME }}
